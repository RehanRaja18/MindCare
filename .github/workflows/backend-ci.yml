name: Backend CI

on:
  push:
    branches: [backend, main]
    paths:
      - 'MindCare Backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'MindCare Backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "MindCare Backend/requirements/dev.txt"

      - name: Install dependencies
        working-directory: "MindCare Backend"
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit checks (repo-wide config, scoped by file path)
        uses: pre-commit/action@v3.0.1

      - name: Check for missing migrations
        working-directory: "MindCare Backend"
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcare_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcare_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: "MindCare Backend"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcare_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcare_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          REDIS_URL: redis://localhost:6379/0
        run: pytest
