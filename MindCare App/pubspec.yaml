name: mindcare_mobile
description: "MindCare - Patient mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  crypto: ^3.0.5
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mindcare_logo.png
    - assets/images/splash/
    - assets/sounds/
